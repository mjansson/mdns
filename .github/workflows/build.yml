name: build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure
      run: cmake -B _build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build _build --config Release --verbose

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: mdns_example-windows
        path: _build/bin/Release/mdns_example.exe

  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure
      run: cmake -B _build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build _build --config Release --verbose

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: mdns_example-ubuntu
        path: _build/bin/mdns_example

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure
      run: cmake -B _build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build _build --config Release --verbose

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: mdns_example-macos
        path: _build/bin/mdns_example

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-ubuntu, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        skip-decompress: true

    - name: Attach to GitHub Release (only on tag)
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        files: |
          mdns_example-windows/mdns_example-windows.zip
          mdns_example-macos/mdns_example-macos.zip
          mdns_example-ubuntu/mdns_example-ubuntu.zip
